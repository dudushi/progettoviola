<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purple</title>
<meta name="description" content="Calendario, classifica e allerta rivali della Ecosport Purple.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Purple">
<meta property="og:description" content="Calendario, classifica e allerta rivali. Si aggiorna da solo.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dudushi.github.io/progettoviola/og.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Purple">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#ffffff; --text:#000000; --ink:#111111;
  --head1:#f7f3fd; --head2:#d6cbea; --grid:#c9bfdc; --edge:#a99ac4;
  --sel:#6a2fb5; --sel-text:#ffffff; --muted:#8a8296; --red:#d81e4a; --green:#1d7a12;
  --ui:Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;
  --comic:Bangers,Impact,"Arial Black",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:12px/1.35 var(--ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.page{position:relative;max-width:520px;margin:0 auto;padding:8px max(10px,env(safe-area-inset-left,0px)) 110px}

/* ===== quiet aqua header ===== */
.head{position:relative;display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:9px 12px;border-radius:12px;overflow:hidden;
  background:linear-gradient(#fdfbff,#eee7f9);border:1px solid #ddd3ec;box-shadow:inset 0 1px 0 #fff}
.head::before{content:"";position:absolute;left:4px;right:4px;top:1px;height:46%;border-radius:10px 10px 30% 30%/10px 10px 8px 8px;
  background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
.head > *{position:relative}
.head .t{flex:1;font:bold 15px/1 Verdana,Geneva,sans-serif;letter-spacing:3px;color:var(--sel)}
.head .t small{display:block;font:10px var(--ui);letter-spacing:0;color:#8a7fa0;margin-top:4px}
.orb{width:30px;height:30px;flex:none;display:block}
.d-net{display:block;width:100%;height:58px;margin:14px 0 4px}

/* ===== quiet gel alerts ===== */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.alert{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  background:linear-gradient(#ffffff,#f6f2fc);border:1px solid #e1d8ef;box-shadow:inset 0 1px 0 #fff;font:11px var(--ui);color:#444}
.burst{flex:none;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9db4,#d81e4a 70%);
  box-shadow:0 0 0 1px rgba(160,20,50,.25)}
.alert.ok .burst{background:radial-gradient(circle at 40% 35%,#d6c2f5,#6a2fb5 70%)}
.alert.even .burst{background:radial-gradient(circle at 40% 35%,#eee,#999 70%)}
.who{font-weight:bold;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap{margin-left:auto;font:bold 11px Verdana,sans-serif;color:var(--red);white-space:nowrap}
.alert.ok .gap{color:var(--sel)}
.alert.even .gap{color:#999}

/* ===== MATLAB-like tables ===== */
.cmd{font:12px "Courier New",Courier,monospace;margin:0 0 6px;color:#222}
.cmd i{font-style:normal;color:var(--sel)}
.grid{overflow-x:auto;border:1px solid #7d6ea0;background:#fff;box-shadow:inset 1px 1px 0 #6b5a8e}
table{border-collapse:collapse;width:100%;font:12px var(--ui);table-layout:fixed}
#cal col.n{width:30px} #cal col.d{width:50px} #cal col.o{width:46px} #cal col.cf{width:40px} #cal col.r{width:40px}
#cl col.n{width:30px} #cl col.s{width:auto} #cl col.p{width:34px} #cl col.x{width:28px} #cl col.st{width:42px}
th,td{border:1px solid var(--grid);padding:4px 6px;white-space:nowrap;height:36px;overflow:hidden;text-overflow:ellipsis}
#cl th,#cl td{height:32px}
thead th{background:linear-gradient(var(--head1),var(--head2));font-weight:normal;color:#222;text-align:center;border-color:var(--edge);box-shadow:inset 1px 1px 0 #fff}
tbody th{background:linear-gradient(90deg,var(--head1),var(--head2));font-weight:normal;color:#333;text-align:right;border-color:var(--edge);box-shadow:inset 1px 1px 0 #fff}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
tbody tr.past td{color:var(--muted)}
td.res.w{color:var(--green)!important;font-weight:bold} td.res.l{color:var(--red)!important;font-weight:bold}
#cal tbody tr{cursor:default}
tbody tr.sel td{background:var(--sel);color:var(--sel-text)!important;border-color:#7f4fc4}
tbody tr.sel th{background:#4a1c86;color:#fff}
@media (hover:hover){#cal tbody tr:not(.sel):hover td{background:#f1ebfb}}
#cal tbody tr:not(.sel):active td{background:#ece4f8}
tr.tbd td{color:#9a6a00;font-style:italic}
td.res.tbd,tr.tbd td.res{color:#b07800;font-size:11px}
#cl tr.us td{background:var(--sel);color:#fff;font-weight:bold;border-color:#7f4fc4}
#cl tr.us th{background:#4a1c86;color:#fff}
#cl tr.riv td.nm::after{content:" !";color:var(--red);font-weight:bold}
/* ===== campo 6 vs 6 ===== */
.court{position:relative;margin-bottom:6px;border:1px solid #7d6ea0;overflow:hidden;touch-action:manipulation}
.floor{position:absolute;left:0;right:0;top:0;background:#7a45c9;
  background:repeating-linear-gradient(90deg,#7444c4 0 14px,#7a4acb 14px 28px)}
.play{position:absolute;left:6%;right:6%;top:9%;bottom:9%;border:2px solid #fff;
  background:repeating-linear-gradient(90deg,#e7dbfa 0 12px,#eee5fc 12px 24px)}
.al{position:absolute;top:0;bottom:0;width:0;border-left:2px solid rgba(255,255,255,.95)}
.al.a1{left:33.33%} .al.a2{left:66.66%}
.play::after{content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;border-left:2px solid #fff}
.net{position:absolute;left:50%;top:4%;bottom:4%;width:8px;margin-left:-4px;
  background:repeating-linear-gradient(0deg,rgba(30,10,60,.55) 0 1px,transparent 1px 4px),rgba(255,255,255,.35);
  border-left:2px solid #1e0a3c;border-right:2px solid #1e0a3c;box-shadow:1px 0 0 rgba(255,255,255,.6)}
.net::before,.net::after{content:"";position:absolute;left:-3px;width:10px;height:6px;background:#1e0a3c}
.net::before{top:-3px} .net::after{bottom:-3px}
.bench{position:absolute;left:0;right:0;bottom:0;background:repeating-conic-gradient(#f4effb 0 25%,#fff 0 50%) 0 0/16px 16px;border-top:1px solid #7d6ea0}
.bench span{position:absolute;left:6px;top:3px;font:10px var(--ui);color:#8a7fa0}
.pl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:left .75s cubic-bezier(.65,0,.35,1),top .75s cubic-bezier(.65,0,.35,1);z-index:2;pointer-events:none}
.pl .hop{display:flex;flex-direction:column;align-items:center;gap:2px}
.pl canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pl .shadow{width:30px;height:5px;margin-top:-2px;border-radius:50%;background:rgba(30,10,60,.22)}
.ball{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:3;pointer-events:none;
  transition:left .9s cubic-bezier(.3,.7,.3,1),top .9s cubic-bezier(.3,.7,.3,1)}
.ball img{width:100%;height:100%;display:block}
.shufrow{display:flex;justify-content:flex-end;gap:8px;margin:0 0 14px}
.gelbtn.ghost{background:linear-gradient(#ffffff,#ece4f8);color:#4a1c86;text-shadow:none;border-color:#b9a6d6}
.ov{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:hidden}
.zones{position:absolute;left:0;top:0;z-index:1;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
.ov .trail{stroke:#1e0a3c;stroke-width:1.5;stroke-dasharray:3 3;opacity:.55}
.ov .ray{stroke:#d81e4a;stroke-width:1.5;stroke-dasharray:5 3;opacity:.85}
.ov .cover{fill:rgba(106,47,181,.08);stroke:#6a2fb5;stroke-width:1.5;stroke-dasharray:4 3}
.ov .shadowz{fill:rgba(30,10,60,.18)}
.ov .lbl{font:bold 8px Verdana,sans-serif;fill:#1e0a3c;paint-order:stroke;stroke:#fff;stroke-width:3px;text-anchor:middle}
.ov .lbl.ok{fill:#1d7a12} .ov .lbl.sys{fill:#6a2fb5;font-weight:normal}
.ov .boom{font:bold 16px Verdana,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}
.ov .boom.ok{fill:#1d7a12} .ov .boom.ko{fill:#d81e4a}
.pl.pick{pointer-events:auto;cursor:pointer;z-index:5}
.pl.pick .hop{animation:pulse 1s ease-in-out infinite}
.pl.pick canvas:first-of-type{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 4px #c13cf2)}
.pl.act canvas:first-of-type{filter:drop-shadow(0 0 3px #ffd84a)}
@keyframes pulse{50%{transform:translateY(-3px)}}
.pl .tag{display:none;font:bold 9px Verdana,sans-serif;color:#fff;background:#1e0a3c;border-radius:3px;padding:0 3px;margin-bottom:1px;line-height:13px}
.pl.pick::after{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px}
.sit{margin:0 0 8px;padding:8px 10px;border:1px solid var(--edge);background:#faf8fe;box-shadow:inset 1px 1px 0 #fff}
.sit-h{display:flex;justify-content:space-between;align-items:baseline}
.sit-h b{font:bold 13px Verdana,sans-serif;color:var(--sel)}
.sit-h span{font:10px var(--ui);color:#8a7fa0}
.sit p{margin:4px 0 0}
.sit .tw{color:#333}
.sit .tp{color:#6a5a86;font-size:11px}
.sit .tp::before{content:"Schema · ";font-weight:bold}
.sit .stp{margin-top:6px;font-weight:bold;color:#1e0a3c}
.sit .stp b.w{color:var(--green)} .sit .stp b.l{color:var(--red)}
.shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.shot{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #c4b3e0;background:linear-gradient(#fff,#f1ebfb);
  color:#4a1c86;font:bold 12px var(--ui);box-shadow:inset 0 1px 0 #fff;cursor:pointer;-webkit-appearance:none;appearance:none}
.shot:active{background:#e4daf3} .shot:disabled{opacity:.5}
.gelbtn{position:relative;overflow:hidden;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid #4a1c86;cursor:pointer;
  background:linear-gradient(#a77ce6,#6a2fb5 60%,#5b26a0);color:#fff;font:bold 13px Verdana,Geneva,sans-serif;letter-spacing:.5px;
  text-shadow:0 1px 1px rgba(40,0,80,.5);box-shadow:0 1px 3px rgba(74,28,134,.35);-webkit-appearance:none;appearance:none}
.gelbtn::before{content:"";position:absolute;left:6px;right:6px;top:2px;height:46%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.08))}
.gelbtn:active{filter:brightness(.92)}
@media (prefers-reduced-motion: reduce){ .pl,.ball{transition:none} }
.rally-wrap{border:1px solid #7d6ea0;box-shadow:inset 1px 1px 0 #6b5a8e;background:#f3ecff;line-height:0}
#rally{width:100%;height:auto;aspect-ratio:16/9;display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.rally-tip{margin:6px 0 16px;font:11px var(--ui);color:#6a5a86}
.rally-tip b{color:var(--sel)}
.roster{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:10px 6px 12px;
  border:1px solid #7d6ea0;box-shadow:inset 1px 1px 0 #6b5a8e;
  background:repeating-conic-gradient(#f4effb 0 25%,#ffffff 0 50%) 0 0/16px 16px}
.kit{flex:none;scroll-snap-align:start;width:104px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kit canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.status{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#f7f3fd,#e6ddf4);border-top:1px solid var(--edge);box-shadow:0 -1px 0 #fff inset,0 -4px 12px rgba(40,10,80,.12)}
.status .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.status .txt{flex:1;min-width:0}
.status .l1{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .l2{color:#555;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.status a{flex:none;display:grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border:1px solid #7d6ea0;border-radius:4px;
  background:linear-gradient(#ffffff,#e4daf3);color:#4a1c86;font:bold 12px var(--ui);text-decoration:none;box-shadow:inset 0 1px 0 #fff}
.status a:active{background:#d6cbea}
.foot{margin-top:12px;text-align:center;color:#999;font:10px var(--ui)}


</style>
</head>

const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const fmt = (t,o) => new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",...o}).format(t);
let LEAGUE = [], M = [], UPDATED = "", selected = -1;

function scoreOf(x){
  if(x.score && (x.score[0] || x.score[1])) return x.score;
  if(x.sets && x.sets.length){ const w = x.sets.filter(s => s[0]>s[1]).length; return [w, x.sets.length-w]; }
  return null;
}
function use(json){
  UPDATED = json.updated || "";
  const MIN_T = Date.UTC(2020,0,1);
  LEAGUE = (Array.isArray(json.matches) ? json.matches : []).filter(x => x && x.a && x.b).map(x => {
    let t = x.t ? Date.parse(x.t) : NaN;
    const bad = isNaN(t) || t < MIN_T;          // data mancante o finta: partita da definire
    return {...x, t: bad ? null : t, postponed: !!x.postponed || (bad && !scoreOf(x))};
  });
  M = LEAGUE.filter(x => TEAM.test(x.a) || TEAM.test(x.b))
    .sort((p,q) => (p.t===null) - (q.t===null) || (p.t||0) - (q.t||0))
    .map(x => {
      const home = TEAM.test(x.a), flip = s => home ? s : [s[1], s[0]], sc = scoreOf(x);
      return { t:x.t, home, opp: home ? x.b : x.a, venue:x.venue||"", city:x.city||"", q:x.q||"", note:x.note||"",
        postponed:x.postponed, sets:(x.sets||[]).map(flip), score: sc ? flip(sc) : null };
    });
}
function standings(){
  const T = {}, add = n => T[n] || (T[n] = {n, pt:0, g:0, v:0, p:0, sv:0, sp:0, pf:0, ps:0});
  LEAGUE.forEach(x => {
    add(x.a); add(x.b);
    const sc = scoreOf(x); if(!sc) return;
    const A = T[x.a], B = T[x.b];
    A.g++; B.g++; A.sv += sc[0]; A.sp += sc[1]; B.sv += sc[1]; B.sp += sc[0];
    (x.sets || []).forEach(s => { A.pf += s[0]; A.ps += s[1]; B.pf += s[1]; B.ps += s[0]; });
    const W = sc[0] > sc[1] ? A : B, L = W === A ? B : A;
    W.v++; L.p++;
    if(Math.min(sc[0], sc[1]) === 2){ W.pt += 2; L.pt += 1; } else W.pt += 3;
  });
  const q = (a,b) => b ? a/b : (a ? 1e9 : 0);
  return Object.values(T).sort((a,b) => b.pt-a.pt || b.v-a.v || q(b.sv,b.sp)-q(a.sv,a.sp) || q(b.pf,b.ps)-q(a.pf,a.ps) || a.n.localeCompare(b.n));
}

function render(){
  const now = Date.now(), tab = standings();
  const us = tab.find(r => TEAM.test(r.n));

  // alerts
  $("#alerts").innerHTML = RIVALS.map(r => {
    const t = tab.find(x => x.n === r) || {pt:0}, d = (us ? us.pt : 0) - t.pt, abs = Math.abs(d);
    const cls = d > 0 ? "ok" : d < 0 ? "" : "even";
    const what = d < 0 ? `ci sta davanti di ${abs} ${abs===1?"punto":"punti"}` : d > 0 ? `è dietro di ${abs} ${abs===1?"punto":"punti"}` : "pari punti";
    return `<div class="alert ${cls}" role="status" aria-label="${r}: ${what}"><span class="burst" aria-hidden="true"></span><span class="who">${r}</span><span class="gap">${d>0?"+":d<0?"−":"="}${d===0?"":abs+" pt"}</span></div>`;
  }).join("");

  // calendar
  const nextI = M.findIndex(m => m.t !== null && now < m.t + DUR);
  if(selected < 0) selected = nextI >= 0 ? nextI : M.length-1;
  $("#rows").innerHTML = M.map((m,i) => {
    const tbd = m.t === null, done = !tbd && now >= m.t + DUR, sc = m.score;
    return `<tr data-i="${i}" class="${done?"past":""}${tbd?" tbd":""}${i===selected?" sel":""}">
      <th>${i+1}</th>
      <td class="num">${tbd ? "—" : fmt(m.t,{day:"2-digit",month:"2-digit"})}</td>
      <td class="num">${tbd ? "—" : fmt(m.t,{hour:"2-digit",minute:"2-digit"})}</td>
      <td>${m.opp}</td>
      <td class="c">${m.home?"C":"F"}</td>
      <td class="c res${sc ? (sc[0]>sc[1]?" w":" l") : ""}">${sc ? sc[0]+"-"+sc[1] : (m.postponed ? "rinv." : done ? "?" : "")}</td>
    </tr>`;
  }).join("");
  status();

  // standings
  $("#clRows").innerHTML = tab.map((r,k) => `<tr class="${TEAM.test(r.n)?"us":RIVALS.includes(r.n)?"riv":""}">
    <th>${k+1}</th><td class="nm">${TEAM.test(r.n)?"Purple":r.n}</td><td class="num"><b>${r.pt}</b></td><td class="num">${r.g}</td>
    <td class="num">${r.v}</td><td class="num">${r.p}</td><td class="c">${r.sv}-${r.sp}</td></tr>`).join("");

  $("#foot").textContent = UPDATED ? "aggiornato " + fmt(Date.parse(UPDATED),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
}
function status(){
  const m = M[selected];
  if(!m){ $("#status").innerHTML = '<div class="in"><div class="txt">Ready</div></div>'; return; }
  const z = t => new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const tbd = m.t === null;
  const cal = tbd ? "" : "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+enc("🏐 Purple vs "+m.opp)+"&dates="+z(m.t)+"/"+z(m.t+DUR)+"&location="+enc(m.q);
  const when = tbd ? "Rinviata, data da definire" : fmt(m.t,{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"") + ", " + fmt(m.t,{hour:"2-digit",minute:"2-digit"});
  const sets = m.sets.length ? m.sets.map(s => s.join("-")).join("  ") : "";
  const l2 = sets || ((m.home ? "In casa, " + m.venue : m.venue + ", " + m.city) + (m.note ? " · " + m.note : ""));
  $("#status").innerHTML = `<div class="in"><div class="txt"><div class="l1">${when} · ${m.opp}</div><div class="l2">${l2}</div></div>`
    + (m.q ? `<a href="https://maps.apple.com/?q=${enc(m.q)}" target="_blank" rel="noopener">Mappa</a>` : "")
    + (!tbd && Date.now() < m.t ? `<a href="${cal}" target="_blank" rel="noopener">+ Cal</a>` : "")
    + `</div>`;
}
$("#rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-i]"); if(!tr) return;
  selected = +tr.dataset.i;
  document.querySelectorAll("#rows tr").forEach(r => r.classList.toggle("sel", r === tr));
  status();
});

async function load(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    if(!j || !Array.isArray(j.matches) || j.matches.length < 10) throw 0;   // dati rotti: usa l’ultima copia buona
    try{ localStorage.setItem("purple-data", JSON.stringify(j)); }catch(e){}
    return j;
  }catch(e){
    try{ const c = JSON.parse(localStorage.getItem("purple-data") || "null"); if(c) return c; }catch(e){}
    return SNAPSHOT;
  }
}

function glyph(c,ch,x,y,col,s){
  const b = PX[ch] || PX[" "]; c.fillStyle = col;
  for(let i=0;i<15;i++) if(b[i]==="1") c.fillRect(x+(i%3)*s, y+Math.floor(i/3)*s, s, s);
}
const LIBERO = new Set([1,5,34]);   // Negro, Bellomo, Elezi
const KC_LIB = {O:"#1e0a3c",P:"#ffffff",L:"#ffffff",D:"#d6cbe9",W:"#6a2fb5"};
function kitCanvas(num, css){
  const lib = LIBERO.has(num), pal = lib ? KC_LIB : KC;
  const j = document.createElement("canvas"); j.width = 32; j.height = 30;
  j.style.width = (32*css)+"px"; j.style.height = (30*css)+"px";
  const c = j.getContext("2d");
  KIT.forEach((r,y) => { for(let x=0;x<r.length;x++){ const col = pal[r[x]]; if(col){ c.fillStyle = col; c.fillRect(x,y,1,1); } } });
  const t = String(num), w = t.length*6 + (t.length-1)*2; let x = Math.floor((32-w)/2);
  const fg = lib ? "#6a2fb5" : "#ffffff", sh = lib ? "#cbbbe6" : KC.D;
  for(const ch of t){ glyph(c,ch,x+1,12,sh,2); glyph(c,ch,x,11,fg,2); x += 8; }
  return j;
}
function nameCanvas(name, css){
  const up = name.toUpperCase(), nw = up.length*4-1;
  const n = document.createElement("canvas"); n.width = nw; n.height = 5;
  n.style.width = (nw*css)+"px"; n.style.height = (5*css)+"px";
  const nc = n.getContext("2d"); let nx = 0; for(const ch of up){ glyph(nc,ch,nx,0,"#2a0e55",1); nx += 4; }
  n.setAttribute("aria-hidden","true");
  return n;
}
function drawRoster(){
  const box = document.getElementById("roster"); if(!box || box.childElementCount) return;
  ROSA.forEach(([name,num]) => {
    const k = document.createElement("div"); k.className = "kit";
    const j = kitCanvas(num, 2);
    j.setAttribute("role","img"); j.setAttribute("aria-label", `${name}, numero ${num}${LIBERO.has(num)?", libero":""}`);
    k.append(j, nameCanvas(name, 2)); box.append(k);
  });
}

  const LV = [
    {t:"Ricezione a W", tip:"In 5 in ricezione: battute lente, prendi il ritmo.", serveT:1.5, xr:[50,120], blk:1, opp:.55},
    {t:"Ricezione a 3", tip:"Meno ricevitori, battuta più veloce.", serveT:1.25, xr:[45,125], blk:1, opp:.6},
    {t:"Ricezione a 2", tip:"Mezzo campo a testa: corri di più.", serveT:1.25, xr:[25,140], blk:2, opp:.6},
    {t:"Seconda intenzione", tip:"Il muro non ti aspetta: zero muri, ma difesa sveglia.", serveT:1.2, xr:[60,130], blk:0, opp:.75},
    {t:"Alza il libero", tip:"Alzata da dietro i 3 m: colpisci più lontano dalla rete.", serveT:1.2, xr:[35,95], blk:2, opp:.65},
    {t:"Pipe", tip:"Seconda linea: devi staccare dietro la linea dei 3 m, o è fallo.", serveT:1.2, xr:[30,100], blk:2, opp:.65, pipe:true},
    {t:"Primo tempo", tip:"Palla veloce: tieni premuto poco e colpisci presto.", serveT:.95, xr:[70,140], blk:1, opp:.7},
    {t:"Muro a 3", tip:"Muro altissimo: salta tanto o fai un pallonetto.", serveT:1.2, xr:[50,130], blk:3, opp:.7},
    {t:"Free ball", tip:"Palla facile e alta: nessuna scusa.", serveT:1.8, xr:[50,120], blk:2, opp:.75},
    {t:"Rigiocata e copertura", tip:"Se ti murano, a volte la copertura salva la palla.", serveT:1.15, xr:[45,130], blk:3, opp:.75, cover:true}
  ];
  const G = 260, R = 3.5;
  let me, them, ball, state, score, best = 0, hearts, lvl, loop, msg, msgT, hold, holdT, parts = [], ray = null, running = false, last = 0, audio = null;
  try{ best = +localStorage.getItem("purple-rally-best") || 0; }catch(e){}
  const kitImg = n => { const k = kitCanvas(n, 1); return k; };
  function pickPlayers(){
    const nums = ROSA.map(r => r[1]).filter(n => !LIBERO.has(n));
    const a = nums[Math.floor(Math.random()*nums.length)];
    let b = a; while(b === a) b = nums[Math.floor(Math.random()*nums.length)];
    return [a,b];
  }
  function reset(){
    const [a,b] = pickPlayers();
    me = {n:a, x:70, y:GROUND, vy:0, air:false, img:kitImg(a)};
    them = {n:b, x:250, y:GROUND, img:kitImg(b), arms:0};
    score = 0; hearts = 3; lvl = 0; loop = 0; hold = false; holdT = 0; parts = [];
    setTip(); serve(); state = "play";
  }
  const L = () => LV[lvl];
  const speed = () => 1 + loop * .15;
  function setTip(){ if(tipEl) tipEl.innerHTML = `<b>${lvl+1}/10 · ${L().t}</b> ${L().tip}`; }
  function launch(x0,y0,x1,T){ ball = {x:x0, y:y0, vx:(x1-x0)/T, vy:(GROUND - R - y0 - .5*G*T*T)/T, side: x1 < NETX ? "me" : "them", hit:false}; }
  function serve(){
    const l = L(); const xl = l.xr[0] + Math.random()*(l.xr[1]-l.xr[0]);
    launch(300, 70, xl, l.serveT / speed());
    if(l.t === "Free ball") ball.vy -= 30;
    them.x = 280; ray = null; setTimeout(() => { them.home = true; }, 400);
  }
  function say(t, col){ msg = {t, col}; msgT = 1.3; }
  function burst(x,y,col){ for(let i=0;i<10;i++) parts.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*120,t:.5,col}); }
  function beep(f, d){
    try{
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(); o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(.04, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
    }catch(e){}
  }
  const landX = b => { // dove atterra la palla
    const a = .5*G, bb = b.vy, cc = b.y - (GROUND - R), d = bb*bb - 4*a*cc;
    const t = d > 0 ? Math.max(0, (-bb + Math.sqrt(d)) / (2*a)) : 0;
    return {x: b.x + b.vx*t, t};
  };
  const crossX = (b, yh) => {  // dove la palla scende all'altezza yh
    const a = .5*G, d = b.vy*b.vy - 4*a*(b.y - yh);
    if(d < 0) return landX(b).x;
    const t = (-b.vy + Math.sqrt(d)) / (2*a); return t > 0 ? b.x + b.vx*t : landX(b).x;
  };
  const blockTop = () => NETTOP - [0, 8, 14, 20][L().blk];
  function point(win, text){
    if(win){ score++; say(text || "PUNTO!", "#1d7a12"); beep(880,.15);
      if(score % 3 === 0){ lvl++; if(lvl >= LV.length){ lvl = 0; loop++; say("GIRO "+(loop+1)+"!", "#6a2fb5"); } setTip(); }
    } else { hearts--; say(text || "NO!", "#d81e4a"); beep(160,.25);
      if(hearts <= 0){ state = "over"; if(score > best){ best = score; try{ localStorage.setItem("purple-rally-best", best); }catch(e){} } return; }
    }
    state = "pause"; setTimeout(() => { if(state === "pause"){ serve(); state = "play"; } }, 900);
  }
  function hit(){
    const hx = me.x + 7, hy = me.y - 34;              // la mano
    if(!ball || ball.side !== "me" || Math.hypot(ball.x - hx, ball.y - hy) > 18) return false;
    if(L().pipe && me.x + 8 > ATK){ point(false, "FALLO 3 M!"); return true; }
    const x0 = ball.x, y0 = ball.y;
    let kind;
    if(me.shot < .2){                                   // tocco breve: pallonetto sopra il muro
      kind = "PALLONETTO"; launch(x0, y0, 192 + Math.random()*25, 1.0);
    } else {                                            // tenuto: schiacciata che passa la rete poco sopra il punto d'impatto
      kind = "SCHIACCIATA";
      const yn = y0 + 3, nx = NETX + 8, xt = 205 + Math.random()*95; let vx = 380 * Math.sqrt(speed()), vy = 0, land = 999;
      for(; vx > 140; vx -= 20){
        const t1 = (nx - x0) / vx; vy = (yn - y0 - .5*G*t1*t1) / t1;
        const a = .5*G, cc = y0 - (GROUND - R), t = (-vy + Math.sqrt(vy*vy - 4*a*cc)) / (2*a);
        land = x0 + vx*t; if(land <= xt) break;
      }
      ball = {x:x0, y:y0, vx, vy, side:"them", hit:true};
      ball.blocked = yn > NETTOP - 1 || (L().blk > 0 && yn > blockTop() && Math.random() < .35 + .15*L().blk);
      if(!ball.blocked && L().blk > 0 && yn > blockTop()) kind = "TOCCO DEL MURO";
    }
    ball.side = "them"; ball.kind = kind;
    burst(x0, y0, "#fff38a"); beep(520,.08); say(kind, "#4a1c86");
    return true;
  }
  function step(dt){
    if(state === "play" || state === "pause"){
      // il nostro giocatore insegue la palla
      if(ball && ball.side === "me" && state === "play"){
        const lx = Math.max(10, Math.min(146, crossX(ball, GROUND - 70) - 7));
        const tx = L().pipe ? Math.min(lx, ATK - 14) : lx;
        me.x += Math.max(-130*dt, Math.min(130*dt, tx - me.x));
      } else if(!me.air) me.x += Math.max(-80*dt, Math.min(80*dt, 70 - me.x));
      if(hold && !me.air) holdT = Math.min(.6, holdT + dt);
      if(me.air){ me.vy += G*dt; me.y += me.vy*dt; if(me.y >= GROUND){ me.y = GROUND; me.air = false; me.vy = 0; } }
      // avversario
      if(ball && ball.side === "them" && !ball.blocked){
        const lx = Math.min(310, Math.max(172, landX(ball).x));
        if(isFinite(lx)) them.x += Math.max(-150*L().opp*speed()*dt, Math.min(150*L().opp*speed()*dt, lx - them.x));
      }
      if(ball && ball.side !== "them") them.x += Math.max(-90*dt, Math.min(90*dt, 245 - them.x));
      if(!isFinite(them.x)) them.x = 245;
      them.arms = ball && ball.x > 120 && ball.x < 200 ? 1 : 0;
      if(ball && state === "play"){
        ball.vy += G*dt; ball.x += ball.vx*dt; ball.y += ball.vy*dt;
        if(me.air && hit()) {}
        if(ball.side === "them" && ball.blocked && ball.x > NETX + 4){
          ball.blocked = false; burst(NETX+8, ball.y, "#d81e4a");
          if(L().cover && Math.random() < .5){ launch(NETX - 4, ball.y, 60 + Math.random()*50, 1.2); ball.side = "me"; say("COPERTURA!", "#6a2fb5"); }
          else { launch(NETX - 4, ball.y, 110 + Math.random()*40, .45); ball.side = "dead"; say("MURATA!", "#d81e4a"); }
        }
        if(ball.y >= GROUND - R){
          ball.y = GROUND - R; burst(ball.x, GROUND - 2, "#ff9db4");
          if(ball.side === "them"){
            if(Math.abs(them.x - ball.x) < 11){ // difende e rimanda
              const l = L(), xl = l.xr[0] + Math.random()*(l.xr[1]-l.xr[0]);
              ball.y = GROUND - 10; launch(ball.x, ball.y, xl, (l.serveT + .1) / speed()); say("DIFESA", "#4a1c86"); beep(300,.08);
            } else point(true, ball.x > 320 ? "FUORI... SCHERZO, DENTRO!" : "PUNTO!");
          } else point(false, ball.side === "dead" ? "MURATA!" : "A TERRA!");
        }
        if(ball && ball.x < -10 && state === "play") point(false, "FUORI!");
        if(ball && ball.x > 335 && ball.side === "them" && state === "play") point(true, "MANI-OUT!");
        // la palla tocca la rete
        if(ball && state === "play" && Math.abs(ball.x - NETX) < 2 && ball.y > NETTOP) { ball.vx *= -.3; }
      }
    }
    parts.forEach(p => { p.vy += 300*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0);
    if(msgT > 0) msgT -= dt;
  }
  function txt(s, x, y, col, sc = 1, center = false){
    s = String(s).toUpperCase(); const w = s.length*4*sc - sc; if(center) x = Math.round(x - w/2);
    for(const ch of s){ glyph(c, ch, x, y, col, sc); x += 4*sc; }
  }
  function drawGuy(p, flip, air){
    const x = Math.round(p.x), y = Math.round(p.y);
    c.save(); c.translate(x, 0); if(flip){ c.scale(-1,1); }
    c.fillStyle = "#1e0a3c"; c.fillRect(-1, y-8, 3, 8); c.fillRect(6, y-8, 3, 8);          // gambe
    c.fillStyle = "#2a0e55"; c.fillRect(-2, y-12, 12, 5);                                    // pantaloncini
    c.drawImage(p.img, -4, y-27, 16, 15);                                                    // maglia
    c.fillStyle = "#f2c9a0"; c.fillRect(1, y-34, 6, 6); c.fillStyle = "#1e0a3c"; c.fillRect(1, y-35, 6, 2);   // testa
    if(air || p.arms){ c.fillStyle = "#f2c9a0"; c.fillRect(7, y-40, 2, 12); }                // braccio alzato
    c.restore();
  }
  function draw(){
    // palestra
    const g = c.createLinearGradient(0,0,0,GROUND); g.addColorStop(0,"#f3ecff"); g.addColorStop(1,"#ddd0f3");
    c.fillStyle = g; c.fillRect(0,0,LW,GROUND);
    c.fillStyle = "#e7dcfa"; for(let i=0;i<LW;i+=40) c.fillRect(i, 18, 24, 30);              // finestroni
    c.fillStyle = "#7444c4"; c.fillRect(0, GROUND, LW, LH-GROUND);
    c.fillStyle = "#8a5ad6"; for(let i=0;i<LW;i+=16) c.fillRect(i, GROUND+6, 10, 2);
    c.fillStyle = "#fff"; c.fillRect(ATK, GROUND, 2, 4); c.fillRect(LW-ATK-2, GROUND, 2, 4);   // linee dei 3 m
    if(L().pipe){ c.fillStyle = "rgba(216,30,74,.12)"; c.fillRect(ATK, 0, NETX-ATK, GROUND); }
    // rete
    c.fillStyle = "#1e0a3c"; c.fillRect(NETX-1, NETTOP, 2, GROUND-NETTOP);
    c.fillStyle = "rgba(30,10,60,.25)"; for(let y=NETTOP+4;y<NETTOP+30;y+=4) c.fillRect(NETX-3, y, 6, 1);
    c.fillStyle = "#fff"; c.fillRect(NETX-3, NETTOP, 6, 3);
    // muro avversario
    for(let i=0;i<L().blk;i++){ c.fillStyle = "rgba(255,255,255,.8)"; c.fillRect(NETX+3+i*3, blockTop()+i*2, 3, NETTOP-blockTop()+6); }
    // raggio di mira mentre tieni premuto
    if(hold && ball && ball.side === "me"){ c.strokeStyle = "rgba(216,30,74,.6)"; c.setLineDash([3,3]); c.beginPath();
      c.moveTo(me.x+7, me.y-34-holdT*60); c.lineTo(285, GROUND-4); c.stroke(); c.setLineDash([]); }
    drawGuy(them, true, false);
    drawGuy({...me, y: me.y + (hold && !me.air ? 3 : 0)}, false, me.air);
    // palla
    if(ball){ const bx = Math.round(ball.x), by = Math.round(ball.y);
      c.fillStyle = "rgba(30,10,60,.25)"; c.fillRect(bx-3, GROUND-1, 6, 2);
      c.fillStyle = "#1e0a3c"; c.fillRect(bx-4, by-3, 8, 6); c.fillRect(bx-3, by-4, 6, 8);
      c.fillStyle = "#8b3dff"; c.fillRect(bx-3, by-3, 6, 6); c.fillStyle = "#fff"; c.fillRect(bx-2, by-2, 2, 2); }
    parts.forEach(p => { c.fillStyle = p.col; c.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); });
    // HUD
    txt(`PUNTI ${score}`, 6, 6, "#4a1c86", 1); txt(`RECORD ${best}`, 6, 13, "#8a7fa0", 1);
    for(let i=0;i<3;i++){ c.fillStyle = i < hearts ? "#d81e4a" : "#c9bfdc"; c.fillRect(LW-12-i*9, 6, 6, 5); c.fillRect(LW-11-i*9, 11, 4, 1); }
    txt(L().t, LW/2, 6, "#6a2fb5", 1, true);
    if(hold && !me.air){ c.fillStyle = "#c9bfdc"; c.fillRect(me.x-4, me.y+4, 20, 3); c.fillStyle = "#6a2fb5"; c.fillRect(me.x-4, me.y+4, 20*holdT/.6, 3); }
    if(msgT > 0 && msg) txt(msg.t, LW/2, 60, msg.col, 2, true);
    if(state === "intro" || state === "over"){
      c.fillStyle = "rgba(255,255,255,.82)"; c.fillRect(40, 44, 240, 76);
      c.strokeStyle = "#6a2fb5"; c.strokeRect(40.5, 44.5, 239, 75);
      txt(state === "over" ? `FINE: ${score} PUNTI` : "PURPLE RALLY", LW/2, 54, "#6a2fb5", 2, true);
      txt("LASCIA IL DITO PER SALTARE SOTTO LA PALLA", LW/2, 76, "#1e0a3c", 1, true);
      txt("TOCCO BREVE: PALLONETTO", LW/2, 86, "#1e0a3c", 1, true);
      txt("TIENI PREMUTO: SCHIACCIATA PIU ALTA", LW/2, 94, "#1e0a3c", 1, true);
      txt(state === "over" ? "TOCCA PER RIGIOCARE" : "TOCCA PER INIZIARE", LW/2, 108, "#d81e4a", 1, true);
    }
  }
  function frame(t){
    if(!running) return;
    const dt = Math.min(.033, (t - last)/1000 || 0); last = t;
    step(dt); draw(); requestAnimationFrame(frame);
  }
  function down(e){
    e.preventDefault();
    if(state === "intro" || state === "over"){ reset(); return; }
    hold = true; holdT = 0;
  }
  function up(e){
    e.preventDefault();
    if(!hold) return; hold = false;
    if(!me.air && state === "play"){ me.air = true; me.shot = holdT; me.vy = -(150 + holdT*55); }
  }
  cv.addEventListener("pointerdown", down); cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("contextmenu", e => e.preventDefault());
  // in pausa quando non si vede (batteria)
  new IntersectionObserver(es => es.forEach(en => {
    if(en.isIntersecting && !running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
    else if(!en.isIntersecting){ running = false; }
  })).observe(cv);
  state = "intro"; const [a,b] = pickPlayers(); me = {n:a,x:70,y:GROUND,vy:0,air:false,img:kitImg(a)}; them = {n:b,x:250,y:GROUND,img:kitImg(b),arms:0};
  score = 0; hearts = 3; lvl = 0; loop = 0; ball = null; setTip(); draw();
  return {reset};
})();

function show(j){
  try{ use(j); render(); }
  catch(e){ console.error(e); if(j !== SNAPSHOT){ use(SNAPSHOT); render(); } }
}
show(SNAPSHOT);
load().then(show);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") load().then(show); });
</script>
</body>
