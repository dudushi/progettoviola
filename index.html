<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purple</title>
<meta name="description" content="Calendario, classifica e allerta rivali della Ecosport Purple.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Purple">
<meta property="og:description" content="Calendario, classifica e allerta rivali. Si aggiorna da solo.">

<meta property="og:image:height" content="630">

<style>
:root{
  --bg:#ffffff; --text:#000000; --ink:#111111;
  --head1:#f7f3fd; --head2:#d6cbea; --grid:#c9bfdc; --edge:#a99ac4;
  --sel:#6a2fb5; --sel-text:#ffffff; --muted:#8a8296; --red:#d81e4a; --green:#1d7a12;
  --ui:Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;
  --comic:Bangers,Impact,"Arial Black",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:12px/1.35 var(--ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.page{position:relative;max-width:520px;margin:0 auto;padding:8px max(10px,env(safe-area-inset-left,0px)) 110px}

/* ===== quiet aqua header ===== */
.head{position:relative;display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:9px 12px;border-radius:12px;overflow:hidden;
  background:linear-gradient(#fdfbff,#eee7f9);border:1px solid #ddd3ec;box-shadow:inset 0 1px 0 #fff}
.head::before{content:"";position:absolute;left:4px;right:4px;top:1px;height:46%;border-radius:10px 10px 30% 30%/10px 10px 8px 8px;
  background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
.head > *{position:relative}
.head .t{flex:1;font:bold 15px/1 Verdana,Geneva,sans-serif;letter-spacing:3px;color:var(--sel)}
.head .t small{display:block;font:10px var(--ui);letter-spacing:0;color:#8a7fa0;margin-top:4px}
.orb{width:26px;height:26px;flex:none}
.d-net{display:block;width:100%;height:58px;margin:14px 0 4px}

/* ===== quiet gel alerts ===== */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.alert{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  background:linear-gradient(#ffffff,#f6f2fc);border:1px solid #e1d8ef;box-shadow:inset 0 1px 0 #fff;font:11px var(--ui);color:#444}
.burst{flex:none;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9db4,#d81e4a 70%);
  box-shadow:0 0 0 1px rgba(160,20,50,.25)}
.alert.ok .burst{background:radial-gradient(circle at 40% 35%,#d6c2f5,#6a2fb5 70%)}
.alert.even .burst{background:radial-gradient(circle at 40% 35%,#eee,#999 70%)}
.who{font-weight:bold;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap{margin-left:auto;font:bold 11px Verdana,sans-serif;color:var(--red);white-space:nowrap}
.alert.ok .gap{color:var(--sel)}
.alert.even .gap{color:#999}

/* ===== MATLAB-like tables ===== */
.cmd{font:12px "Courier New",Courier,monospace;margin:0 0 6px;color:#222}
.cmd i{font-style:normal;color:var(--sel)}
.grid{overflow-x:auto;border:1px solid #7d6ea0;background:#fff;box-shadow:inset 1px 1px 0 #6b5a8e}
table{border-collapse:collapse;width:100%;font:12px var(--ui);table-layout:fixed}
#cal col.n{width:30px} #cal col.d{width:50px} #cal col.o{width:46px} #cal col.cf{width:40px} #cal col.r{width:40px}
#cl col.n{width:30px} #cl col.s{width:auto} #cl col.p{width:34px} #cl col.x{width:28px} #cl col.st{width:42px}
th,td{border:1px solid var(--grid);padding:4px 6px;white-space:nowrap;height:36px;overflow:hidden;text-overflow:ellipsis}
#cl th,#cl td{height:32px}
thead th{background:linear-gradient(var(--head1),var(--head2));font-weight:normal;color:#222;text-align:center;border-color:var(--edge);box-shadow:inset 1px 1px 0 #fff}
tbody th{background:linear-gradient(90deg,var(--head1),var(--head2));font-weight:normal;color:#333;text-align:right;border-color:var(--edge);box-shadow:inset 1px 1px 0 #fff}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
tbody tr.past td{color:var(--muted)}
td.res.w{color:var(--green)!important;font-weight:bold} td.res.l{color:var(--red)!important;font-weight:bold}
#cal tbody tr{cursor:default}
tbody tr.sel td{background:var(--sel);color:var(--sel-text)!important;border-color:#7f4fc4}
tbody tr.sel th{background:#4a1c86;color:#fff}
@media (hover:hover){#cal tbody tr:not(.sel):hover td{background:#f1ebfb}}
#cal tbody tr:not(.sel):active td{background:#ece4f8}
#cl tr.us td{background:var(--sel);color:#fff;font-weight:bold;border-color:#7f4fc4}
#cl tr.us th{background:#4a1c86;color:#fff}
#cl tr.riv td.nm::after{content:" !";color:var(--red);font-weight:bold}
.status{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#f7f3fd,#e6ddf4);border-top:1px solid var(--edge);box-shadow:0 -1px 0 #fff inset,0 -4px 12px rgba(40,10,80,.12)}
.status .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.status .txt{flex:1;min-width:0}
.status .l1{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .l2{color:#555;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.status a{flex:none;display:grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border:1px solid #7d6ea0;border-radius:4px;
  background:linear-gradient(#ffffff,#e4daf3);color:#4a1c86;font:bold 12px var(--ui);text-decoration:none;box-shadow:inset 0 1px 0 #fff}
.status a:active{background:#d6cbea}
.foot{margin-top:12px;text-align:center;color:#999;font:10px var(--ui)}


</style>
</head>
<body>
<div class="page">

  <div class="head">
    <div class="t">PURPLE<small>Eccellenza maschile, girone A</small></div>
    <svg class="orb" viewBox="0 0 46 46" aria-hidden="true">
      <defs><radialGradient id="og" cx="45%" cy="35%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#f1eafb"/><stop offset="1" stop-color="#c9b8e6"/></radialGradient></defs>
      <circle cx="23" cy="23" r="21" fill="url(#og)" stroke="#8f6bbf" stroke-width="1.6"/>
      <path d="M23 2 C 32 12, 32 34, 23 44 M5 13 C 17 20, 31 22, 41 31 M4 31 C 14 27, 22 14, 26 3" fill="none" stroke="#8f6bbf" stroke-width="2"/>
      <ellipse cx="17" cy="11" rx="8" ry="4" fill="#fff" opacity=".9"/>
    </svg>
  </div>

  <div class="alerts" id="alerts"></div>

  <p class="cmd">&gt;&gt; <i>classifica</i>('eccellenza A')</p>
  <div class="grid">
    <table id="cl"><colgroup><col class="n"><col class="s"><col class="p"><col class="x"><col class="x"><col class="x"><col class="st"></colgroup>
      <thead><tr><th></th><th>Squadra</th><th>Pt</th><th>G</th><th>V</th><th>P</th><th>Set</th></tr></thead>
      <tbody id="clRows"></tbody>
    </table>
  </div>


  <svg class="d-net" viewBox="0 0 760 58" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs><pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#111" stroke-width=".7"/></pattern></defs>
    <rect x="40" y="26" width="680" height="16" fill="url(#mesh)" stroke="#111" stroke-width="1.5"/>
    <rect x="40" y="22" width="680" height="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <line x1="40" y1="20" x2="40" y2="56" stroke="#111" stroke-width="3"/>
    <line x1="720" y1="20" x2="720" y2="56" stroke="#111" stroke-width="3"/>
    <g stroke="#111" stroke-linecap="round" stroke-width="1.5"><line x1="300" y1="6" x2="372" y2="12"/><line x1="312" y1="14" x2="370" y2="16"/><line x1="326" y1="20" x2="372" y2="20"/></g>
    <g transform="translate(392 14) rotate(30)">
      <circle r="11" fill="#fff" stroke="#111" stroke-width="2"/>
      <path d="M0 -11 C 5 -4, 5 4, 0 11 M-10 -5 C -3 -1, 5 1, 10 5 M-10 5 C -5 3, 1 -5, 3 -10" fill="none" stroke="#111" stroke-width="1.4"/>
    </g>
  </svg>

  <p class="cmd">&gt;&gt; <i>calendario</i>('purple')</p>
  <div class="grid">
    <table id="cal"><colgroup><col class="n"><col class="d"><col class="o"><col><col class="cf"><col class="r"></colgroup>
      <thead><tr><th></th><th>Data</th><th>Ora</th><th>Avversario</th><th>C/F</th><th>Ris.</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="status" id="status" aria-live="polite"></div>

  <p class="foot" id="foot"></p>
</div>

<script>
const TEAM = /purple/i, RIVALS = ["Kolbe","Icaro M1"], DUR = 2*3600e3;
const SNAPSHOT = {"updated":"2026-11-08T14:00+01:00","matches":[{"g":1,"n":611105,"t":"2026-11-02T21:00:00+01:00","a":"PGS Pianezza","b":"Polisport Nuncas","venue":"Pal. Papa Giovanni XXIII","city":"Pianezza","q":"Pal. Papa Giovanni XXIII - Via A. Manzoni 7, Pianezza","score":[3,0],"sets":[[25,20],[25,17],[25,19]]},{"g":1,"n":611102,"t":"2026-11-03T21:00:00+01:00","a":"ASD Ecosportorino Dark","b":"Camaleonte Brandizzo","venue":"Pal. Cecchi","city":"Torino","q":"Pal. Cecchi - Via A. Cecchi, 14, Torino","note":"Ammessi solo tesserati","score":[3,2],"sets":[[25,10],[24,26],[25,23],[25,18],[15,12]]},{"g":1,"n":611103,"t":"2026-11-05T20:45:00+01:00","a":"Ecosport Purple","b":"Kolbe","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino","score":[2,3],"sets":[[25,22],[17,25],[16,25],[25,22],[14,16]]},{"g":10,"n":611149,"t":"2026-11-05T21:15:00+01:00","a":"Caselette Volley","b":"Icaro M1","venue":"Istituto Comprensivo","city":"Caselette","q":"Istituto Comprensivo - Strada Contessa, 90 - Caselette","score":[0,3],"sets":[[19,25],[19,25],[19,25]]},{"g":1,"n":611101,"t":"2026-11-05T21:30:00+01:00","a":"Maschile B Linnaeus","b":"Kubo Volley","venue":"Pal.Comunale","city":"Borgone di Susa","q":"Pal.Comunale - Via Bobba Guido, 41 - Borgone di Susa","score":[3,0],"sets":[[25,16],[25,18],[25,21]]},{"g":2,"n":611109,"t":"2026-11-11T21:15:00+01:00","a":"Camaleonte Brandizzo","b":"Ecosport Purple","venue":"Via Nicolao Cena,2","city":"Brandizzo","q":"via Nicolao Cena,2 Brandizzo"},{"g":3,"n":611112,"t":"2026-11-19T20:45:00+01:00","a":"Ecosport Purple","b":"Maschile B Linnaeus","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":13,"n":611165,"t":"2026-11-26T20:45:00+01:00","a":"Ecosport Purple","b":"ASD Ecosportorino Dark","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":5,"n":611121,"t":"2026-12-03T20:45:00+01:00","a":"Ecosport Purple","b":"Kubo Volley","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":6,"n":611130,"t":"2026-12-10T20:45:00+01:00","a":"Ecosport Purple","b":"Icaro M1","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":7,"n":611132,"t":"2026-12-14T21:00:00+01:00","a":"PGS Pianezza","b":"Ecosport Purple","venue":"Pal. Papa Giovanni XXIII","city":"Pianezza","q":"Pal. Papa Giovanni XXIII - Via A. Manzoni 7, Pianezza"},{"g":8,"n":611139,"t":"2027-01-14T20:45:00+01:00","a":"Ecosport Purple","b":"Polisport Nuncas","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":9,"n":611143,"t":"2027-01-21T21:15:00+01:00","a":"Caselette Volley","b":"Ecosport Purple","venue":"Istituto Comprensivo","city":"Caselette","q":"Istituto Comprensivo - Strada Contessa, 90 - Caselette"},{"g":10,"n":611148,"t":"2027-01-24T18:00:00+01:00","a":"Kolbe","b":"Ecosport Purple","venue":"Pal. Aprica","city":"Torino","q":"Pal. Aprica Via Bard, 39 Torino"},{"g":11,"n":611154,"t":"2027-02-04T20:45:00+01:00","a":"Ecosport Purple","b":"Camaleonte Brandizzo","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":12,"n":611157,"t":"2027-02-18T21:30:00+01:00","a":"Maschile B Linnaeus","b":"Ecosport Purple","venue":"Pal.Comunale","city":"Borgone di Susa","q":"Pal.Comunale - Via Bobba Guido, 41 - Borgone di Susa"},{"g":4,"n":611120,"t":"2027-02-24T21:00:00+01:00","a":"ASD Ecosportorino Dark","b":"Ecosport Purple","venue":"Pal. Cecchi","city":"Torino","q":"Pal. Cecchi - Via A. Cecchi, 14, Torino","note":"Ammessi solo tesserati"},{"g":14,"n":611166,"t":"2027-03-03T21:00:00+01:00","a":"Kubo Volley","b":"Ecosport Purple","venue":"Palestra Palazzeschi","city":"Torino","q":"Palestra Palazzeschi - Scuola Media Statale Aldo Palazzeschi, Torino"},{"g":15,"n":611175,"t":"2027-03-12T20:30:00+01:00","a":"Icaro M1","b":"Ecosport Purple","venue":"Impianto Sportivo Luini","city":"Torino","q":"Impianto Sportivo Luini , Via luini 170, Torino"},{"g":16,"n":611177,"t":"2027-03-18T20:45:00+01:00","a":"Ecosport Purple","b":"PGS Pianezza","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":17,"n":611184,"t":"2027-04-01T21:00:00+02:00","a":"Polisport Nuncas","b":"Ecosport Purple","venue":"Cecchi","city":"Torino","q":"Cecchi Via Cecchi 16, Torino","note":"Ammessi solo tesserati"},{"g":18,"n":611188,"t":"2027-04-08T20:45:00+02:00","a":"Ecosport Purple","b":"Caselette Volley","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"}]};
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const fmt = (t,o) => new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",...o}).format(t);
let LEAGUE = [], M = [], UPDATED = "", selected = -1;

function scoreOf(x){
  if(x.score && (x.score[0] || x.score[1])) return x.score;
  if(x.sets && x.sets.length){ const w = x.sets.filter(s => s[0]>s[1]).length; return [w, x.sets.length-w]; }
  return null;
}
function use(json){
  UPDATED = json.updated || "";
  LEAGUE = (json.matches || []).map(x => ({...x, t: Date.parse(x.t)})).filter(x => !isNaN(x.t));
  M = LEAGUE.filter(x => TEAM.test(x.a) || TEAM.test(x.b)).sort((p,q) => p.t-q.t).map(x => {
    const home = TEAM.test(x.a), flip = s => home ? s : [s[1], s[0]], sc = scoreOf(x);
    return { t:x.t, home, opp: home ? x.b : x.a, venue:x.venue||"", city:x.city||"", q:x.q||"", note:x.note||"",
      sets:(x.sets||[]).map(flip), score: sc ? flip(sc) : null };
  });
}
function standings(){
  const T = {}, add = n => T[n] || (T[n] = {n, pt:0, g:0, v:0, p:0, sv:0, sp:0, pf:0, ps:0});
  LEAGUE.forEach(x => {
    add(x.a); add(x.b);
    const sc = scoreOf(x); if(!sc) return;
    const A = T[x.a], B = T[x.b];
    A.g++; B.g++; A.sv += sc[0]; A.sp += sc[1]; B.sv += sc[1]; B.sp += sc[0];
    (x.sets || []).forEach(s => { A.pf += s[0]; A.ps += s[1]; B.pf += s[1]; B.ps += s[0]; });
    const W = sc[0] > sc[1] ? A : B, L = W === A ? B : A;
    W.v++; L.p++;
    if(Math.min(sc[0], sc[1]) === 2){ W.pt += 2; L.pt += 1; } else W.pt += 3;
  });
  const q = (a,b) => b ? a/b : (a ? 1e9 : 0);
  return Object.values(T).sort((a,b) => b.pt-a.pt || b.v-a.v || q(b.sv,b.sp)-q(a.sv,a.sp) || q(b.pf,b.ps)-q(a.pf,a.ps) || a.n.localeCompare(b.n));
}

function render(){
  const now = Date.now(), tab = standings();
  const us = tab.find(r => TEAM.test(r.n));

  // alerts
  $("#alerts").innerHTML = RIVALS.map(r => {
    const t = tab.find(x => x.n === r) || {pt:0}, d = (us ? us.pt : 0) - t.pt, abs = Math.abs(d);
    const cls = d > 0 ? "ok" : d < 0 ? "" : "even";
    const what = d < 0 ? `ci sta davanti di ${abs} ${abs===1?"punto":"punti"}` : d > 0 ? `è dietro di ${abs} ${abs===1?"punto":"punti"}` : "pari punti";
    return `<div class="alert ${cls}" role="status" aria-label="${r}: ${what}"><span class="burst" aria-hidden="true"></span><span class="who">${r}</span><span class="gap">${d>0?"+":d<0?"−":"="}${d===0?"":abs+" pt"}</span></div>`;
  }).join("");

  // calendar
  const nextI = M.findIndex(m => now < m.t + DUR);
  if(selected < 0) selected = nextI >= 0 ? nextI : M.length-1;
  $("#rows").innerHTML = M.map((m,i) => {
    const done = now >= m.t + DUR, sc = m.score;
    return `<tr data-i="${i}" class="${done?"past":""}${i===selected?" sel":""}">
      <th>${i+1}</th>
      <td class="num">${fmt(m.t,{day:"2-digit",month:"2-digit"})}</td>
      <td class="num">${fmt(m.t,{hour:"2-digit",minute:"2-digit"})}</td>
      <td>${m.opp}</td>
      <td class="c">${m.home?"C":"F"}</td>
      <td class="c res${sc ? (sc[0]>sc[1]?" w":" l") : ""}">${sc ? sc[0]+"-"+sc[1] : (done ? "?" : "")}</td>
    </tr>`;
  }).join("");
  status();

  // standings
  $("#clRows").innerHTML = tab.map((r,k) => `<tr class="${TEAM.test(r.n)?"us":RIVALS.includes(r.n)?"riv":""}">
    <th>${k+1}</th><td class="nm">${TEAM.test(r.n)?"Purple":r.n}</td><td class="num"><b>${r.pt}</b></td><td class="num">${r.g}</td>
    <td class="num">${r.v}</td><td class="num">${r.p}</td><td class="c">${r.sv}-${r.sp}</td></tr>`).join("");

  $("#foot").textContent = UPDATED ? "aggiornato " + fmt(Date.parse(UPDATED),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
}
function status(){
  const m = M[selected];
  if(!m){ $("#status").innerHTML = '<div class="in"><div class="txt">Ready</div></div>'; return; }
  const z = t => new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const cal = "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+enc("🏐 Purple vs "+m.opp)+"&dates="+z(m.t)+"/"+z(m.t+DUR)+"&location="+enc(m.q);
  const when = fmt(m.t,{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"") + ", " + fmt(m.t,{hour:"2-digit",minute:"2-digit"});
  const sets = m.sets.length ? m.sets.map(s => s.join("-")).join("  ") : "";
  const l2 = sets || ((m.home ? "In casa, " + m.venue : m.venue + ", " + m.city) + (m.note ? " · " + m.note : ""));
  $("#status").innerHTML = `<div class="in"><div class="txt"><div class="l1">${when} · ${m.opp}</div><div class="l2">${l2}</div></div>`
    + (m.q ? `<a href="https://maps.apple.com/?q=${enc(m.q)}" target="_blank" rel="noopener">Mappa</a>` : "")
    + (Date.now() < m.t ? `<a href="${cal}" target="_blank" rel="noopener">+ Cal</a>` : "")
    + `</div>`;
}
$("#rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-i]"); if(!tr) return;
  selected = +tr.dataset.i;
  document.querySelectorAll("#rows tr").forEach(r => r.classList.toggle("sel", r === tr));
  status();
});

async function load(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    try{ localStorage.setItem("purple-data", JSON.stringify(j)); }catch(e){}
    return j;
  }catch(e){
    try{ const c = JSON.parse(localStorage.getItem("purple-data") || "null"); if(c) return c; }catch(e){}
    return SNAPSHOT;
  }
}
use(SNAPSHOT); render();
load().then(j => { use(j); render(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") load().then(j => { use(j); render(); }); });
</script>
