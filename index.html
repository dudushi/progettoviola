<style>
:root{
  --bg:#ffffff; --text:#000000; --ink:#111111;
  --head1:#f7f3fd; --head2:#d6cbea; --grid:#c9bfdc; --edge:#a99ac4;
  --sel:#6a2fb5; --sel-text:#ffffff; --muted:#8a8296; --red:#d81e4a; --green:#1d7a12;
  --ui:Tahoma,"MS Sans Serif",Geneva,Verdana,sans-serif;
  --comic:Bangers,Impact,"Arial Black",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:12px/1.35 var(--ui);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.page{position:relative;max-width:520px;margin:0 auto;padding:8px max(10px,env(safe-area-inset-left,0px)) 110px}

/* ===== quiet aqua header ===== */
.head{position:relative;display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:9px 12px;border-radius:12px;overflow:hidden;
  background:linear-gradient(#fdfbff,#eee7f9);border:1px solid #ddd3ec;box-shadow:inset 0 1px 0 #fff}
.head::before{content:"";position:absolute;left:4px;right:4px;top:1px;height:46%;border-radius:10px 10px 30% 30%/10px 10px 8px 8px;
  background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
.head > *{position:relative}
.head .t{flex:1;font:bold 15px/1 Verdana,Geneva,sans-serif;letter-spacing:3px;color:var(--sel)}
.head .t small{display:block;font:10px var(--ui);letter-spacing:0;color:#8a7fa0;margin-top:4px}
.orb{width:30px;height:30px;flex:none;display:block}
.d-net{display:block;width:100%;height:58px;margin:14px 0 4px}

/* ===== quiet gel alerts ===== */
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.alert{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  background:linear-gradient(#ffffff,#f6f2fc);border:1px solid #e1d8ef;box-shadow:inset 0 1px 0 #fff;font:11px var(--ui);color:#444}
.burst{flex:none;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9db4,#d81e4a 70%);
  box-shadow:0 0 0 1px rgba(160,20,50,.25)}
.alert.ok .burst{background:radial-gradient(circle at 40% 35%,#d6c2f5,#6a2fb5 70%)}
.alert.even .burst{background:radial-gradient(circle at 40% 35%,#eee,#999 70%)}
.who{font-weight:bold;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap{margin-left:auto;font:bold 11px Verdana,sans-serif;color:var(--red);white-space:nowrap}
.alert.ok .gap{color:var(--sel)}
.alert.even .gap{color:#999}

/* ===== MATLAB-like tables ===== */
.cmd{font:12px "Courier New",Courier,monospace;margin:0 0 6px;color:#222}
.cmd i{font-style:normal;color:var(--sel)}
.grid{overflow-x:auto;border:1px solid #7d6ea0;background:#fff;box-shadow:inset 1px 1px 0 #6b5a8e}
table{border-collapse:collapse;width:100%;font:12px var(--ui);table-layout:fixed}
#cal col.n{width:30px} #cal col.d{width:50px} #cal col.o{width:46px} #cal col.cf{width:40px} #cal col.r{width:40px}
#cl col.n{width:30px} #cl col.s{width:auto} #cl col.p{width:34px} #cl col.x{width:28px} #cl col.st{width:42px}
th,td{border:1px solid var(--grid);padding:4px 6px;white-space:nowrap;height:36px;overflow:hidden;text-overflow:ellipsis}
#cl th,#cl td{height:32px}
thead th{background:linear-gradient(var(--head1),var(--head2));font-weight:normal;color:#222;text-align:center;border-color:var(--edge);box-shadow:inset 1px 1px 0 #fff}
tbody th{background:linear-gradient(90deg,var(--head1),var(--head2));font-weight:normal;color:#333;text-align:right;border-color:var(--edge);box-shadow:inset 1px 1px 0 #fff}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
tbody tr.past td{color:var(--muted)}
td.res.w{color:var(--green)!important;font-weight:bold} td.res.l{color:var(--red)!important;font-weight:bold}
#cal tbody tr{cursor:default}
tbody tr.sel td{background:var(--sel);color:var(--sel-text)!important;border-color:#7f4fc4}
tbody tr.sel th{background:#4a1c86;color:#fff}
@media (hover:hover){#cal tbody tr:not(.sel):hover td{background:#f1ebfb}}
#cal tbody tr:not(.sel):active td{background:#ece4f8}
tr.tbd td{color:#9a6a00;font-style:italic}
td.res.tbd,tr.tbd td.res{color:#b07800;font-size:11px}
#cl tr.us td{background:var(--sel);color:#fff;font-weight:bold;border-color:#7f4fc4}
#cl tr.us th{background:#4a1c86;color:#fff}
#cl tr.riv td.nm::after{content:" !";color:var(--red);font-weight:bold}
/* ===== campo 6 vs 6 ===== */
.court{position:relative;margin-bottom:6px;border:1px solid #7d6ea0;overflow:hidden;touch-action:manipulation}
.floor{position:absolute;left:0;right:0;top:0;background:#7a45c9;
  background:repeating-linear-gradient(90deg,#7444c4 0 14px,#7a4acb 14px 28px)}
.play{position:absolute;left:6%;right:6%;top:9%;bottom:9%;border:2px solid #fff;
  background:repeating-linear-gradient(90deg,#e7dbfa 0 12px,#eee5fc 12px 24px)}
.al{position:absolute;top:0;bottom:0;width:0;border-left:2px solid rgba(255,255,255,.95)}
.al.a1{left:33.33%} .al.a2{left:66.66%}
.play::after{content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;border-left:2px solid #fff}
.net{position:absolute;left:50%;top:4%;bottom:4%;width:8px;margin-left:-4px;
  background:repeating-linear-gradient(0deg,rgba(30,10,60,.55) 0 1px,transparent 1px 4px),rgba(255,255,255,.35);
  border-left:2px solid #1e0a3c;border-right:2px solid #1e0a3c;box-shadow:1px 0 0 rgba(255,255,255,.6)}
.net::before,.net::after{content:"";position:absolute;left:-3px;width:10px;height:6px;background:#1e0a3c}
.net::before{top:-3px} .net::after{bottom:-3px}
.bench{position:absolute;left:0;right:0;bottom:0;background:repeating-conic-gradient(#f4effb 0 25%,#fff 0 50%) 0 0/16px 16px;border-top:1px solid #7d6ea0}
.bench span{position:absolute;left:6px;top:3px;font:10px var(--ui);color:#8a7fa0}
.pl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:left .75s cubic-bezier(.65,0,.35,1),top .75s cubic-bezier(.65,0,.35,1);z-index:2;pointer-events:none}
.pl .hop{display:flex;flex-direction:column;align-items:center;gap:2px}
.pl canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pl .shadow{width:30px;height:5px;margin-top:-2px;border-radius:50%;background:rgba(30,10,60,.22)}
.ball{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:3;pointer-events:none;
  transition:left .9s cubic-bezier(.3,.7,.3,1),top .9s cubic-bezier(.3,.7,.3,1)}
.ball img{width:100%;height:100%;display:block}
.shufrow{display:flex;justify-content:flex-end;margin:0 0 14px}
.gelbtn{position:relative;overflow:hidden;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid #4a1c86;cursor:pointer;
  background:linear-gradient(#a77ce6,#6a2fb5 60%,#5b26a0);color:#fff;font:bold 13px Verdana,Geneva,sans-serif;letter-spacing:.5px;
  text-shadow:0 1px 1px rgba(40,0,80,.5);box-shadow:0 1px 3px rgba(74,28,134,.35);-webkit-appearance:none;appearance:none}
.gelbtn::before{content:"";position:absolute;left:6px;right:6px;top:2px;height:46%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.08))}
.gelbtn:active{filter:brightness(.92)}
@media (prefers-reduced-motion: reduce){ .pl,.ball{transition:none} }
.roster{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:10px 6px 12px;
  border:1px solid #7d6ea0;box-shadow:inset 1px 1px 0 #6b5a8e;
  background:repeating-conic-gradient(#f4effb 0 25%,#ffffff 0 50%) 0 0/16px 16px}
.kit{flex:none;scroll-snap-align:start;width:104px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kit canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.status{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#f7f3fd,#e6ddf4);border-top:1px solid var(--edge);box-shadow:0 -1px 0 #fff inset,0 -4px 12px rgba(40,10,80,.12)}
.status .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.status .txt{flex:1;min-width:0}
.status .l1{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .l2{color:#555;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.status a{flex:none;display:grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border:1px solid #7d6ea0;border-radius:4px;
  background:linear-gradient(#ffffff,#e4daf3);color:#4a1c86;font:bold 12px var(--ui);text-decoration:none;box-shadow:inset 0 1px 0 #fff}
.status a:active{background:#d6cbea}
.foot{margin-top:12px;text-align:center;color:#999;font:10px var(--ui)}


</style>
</head>

const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const fmt = (t,o) => new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",...o}).format(t);
let LEAGUE = [], M = [], UPDATED = "", selected = -1;

function scoreOf(x){
  if(x.score && (x.score[0] || x.score[1])) return x.score;
  if(x.sets && x.sets.length){ const w = x.sets.filter(s => s[0]>s[1]).length; return [w, x.sets.length-w]; }
  return null;
}
function use(json){
  UPDATED = json.updated || "";
  const MIN_T = Date.UTC(2020,0,1);
  LEAGUE = (Array.isArray(json.matches) ? json.matches : []).filter(x => x && x.a && x.b).map(x => {
    let t = x.t ? Date.parse(x.t) : NaN;
    const bad = isNaN(t) || t < MIN_T;          // data mancante o finta: partita da definire
    return {...x, t: bad ? null : t, postponed: !!x.postponed || (bad && !scoreOf(x))};
  });
  M = LEAGUE.filter(x => TEAM.test(x.a) || TEAM.test(x.b))
    .sort((p,q) => (p.t===null) - (q.t===null) || (p.t||0) - (q.t||0))
    .map(x => {
      const home = TEAM.test(x.a), flip = s => home ? s : [s[1], s[0]], sc = scoreOf(x);
      return { t:x.t, home, opp: home ? x.b : x.a, venue:x.venue||"", city:x.city||"", q:x.q||"", note:x.note||"",
        postponed:x.postponed, sets:(x.sets||[]).map(flip), score: sc ? flip(sc) : null };
    });
}
function standings(){
  const T = {}, add = n => T[n] || (T[n] = {n, pt:0, g:0, v:0, p:0, sv:0, sp:0, pf:0, ps:0});
  LEAGUE.forEach(x => {
    add(x.a); add(x.b);
    const sc = scoreOf(x); if(!sc) return;
    const A = T[x.a], B = T[x.b];
    A.g++; B.g++; A.sv += sc[0]; A.sp += sc[1]; B.sv += sc[1]; B.sp += sc[0];
    (x.sets || []).forEach(s => { A.pf += s[0]; A.ps += s[1]; B.pf += s[1]; B.ps += s[0]; });
    const W = sc[0] > sc[1] ? A : B, L = W === A ? B : A;
    W.v++; L.p++;
    if(Math.min(sc[0], sc[1]) === 2){ W.pt += 2; L.pt += 1; } else W.pt += 3;
  });
  const q = (a,b) => b ? a/b : (a ? 1e9 : 0);
  return Object.values(T).sort((a,b) => b.pt-a.pt || b.v-a.v || q(b.sv,b.sp)-q(a.sv,a.sp) || q(b.pf,b.ps)-q(a.pf,a.ps) || a.n.localeCompare(b.n));
}

function render(){
  const now = Date.now(), tab = standings();
  const us = tab.find(r => TEAM.test(r.n));

  // alerts
  $("#alerts").innerHTML = RIVALS.map(r => {
    const t = tab.find(x => x.n === r) || {pt:0}, d = (us ? us.pt : 0) - t.pt, abs = Math.abs(d);
    const cls = d > 0 ? "ok" : d < 0 ? "" : "even";
    const what = d < 0 ? `ci sta davanti di ${abs} ${abs===1?"punto":"punti"}` : d > 0 ? `è dietro di ${abs} ${abs===1?"punto":"punti"}` : "pari punti";
    return `<div class="alert ${cls}" role="status" aria-label="${r}: ${what}"><span class="burst" aria-hidden="true"></span><span class="who">${r}</span><span class="gap">${d>0?"+":d<0?"−":"="}${d===0?"":abs+" pt"}</span></div>`;
  }).join("");

  // calendar
  const nextI = M.findIndex(m => m.t !== null && now < m.t + DUR);
  if(selected < 0) selected = nextI >= 0 ? nextI : M.length-1;
  $("#rows").innerHTML = M.map((m,i) => {
    const tbd = m.t === null, done = !tbd && now >= m.t + DUR, sc = m.score;
    return `<tr data-i="${i}" class="${done?"past":""}${tbd?" tbd":""}${i===selected?" sel":""}">
      <th>${i+1}</th>
      <td class="num">${tbd ? "—" : fmt(m.t,{day:"2-digit",month:"2-digit"})}</td>
      <td class="num">${tbd ? "—" : fmt(m.t,{hour:"2-digit",minute:"2-digit"})}</td>
      <td>${m.opp}</td>
      <td class="c">${m.home?"C":"F"}</td>
      <td class="c res${sc ? (sc[0]>sc[1]?" w":" l") : ""}">${sc ? sc[0]+"-"+sc[1] : (m.postponed ? "rinv." : done ? "?" : "")}</td>
    </tr>`;
  }).join("");
  status();

  // standings
  $("#clRows").innerHTML = tab.map((r,k) => `<tr class="${TEAM.test(r.n)?"us":RIVALS.includes(r.n)?"riv":""}">
    <th>${k+1}</th><td class="nm">${TEAM.test(r.n)?"Purple":r.n}</td><td class="num"><b>${r.pt}</b></td><td class="num">${r.g}</td>
    <td class="num">${r.v}</td><td class="num">${r.p}</td><td class="c">${r.sv}-${r.sp}</td></tr>`).join("");

  $("#foot").textContent = UPDATED ? "aggiornato " + fmt(Date.parse(UPDATED),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
}
function status(){
  const m = M[selected];
  if(!m){ $("#status").innerHTML = '<div class="in"><div class="txt">Ready</div></div>'; return; }
  const z = t => new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const tbd = m.t === null;
  const cal = tbd ? "" : "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+enc("🏐 Purple vs "+m.opp)+"&dates="+z(m.t)+"/"+z(m.t+DUR)+"&location="+enc(m.q);
  const when = tbd ? "Rinviata, data da definire" : fmt(m.t,{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"") + ", " + fmt(m.t,{hour:"2-digit",minute:"2-digit"});
  const sets = m.sets.length ? m.sets.map(s => s.join("-")).join("  ") : "";
  const l2 = sets || ((m.home ? "In casa, " + m.venue : m.venue + ", " + m.city) + (m.note ? " · " + m.note : ""));
  $("#status").innerHTML = `<div class="in"><div class="txt"><div class="l1">${when} · ${m.opp}</div><div class="l2">${l2}</div></div>`
    + (m.q ? `<a href="https://maps.apple.com/?q=${enc(m.q)}" target="_blank" rel="noopener">Mappa</a>` : "")
    + (!tbd && Date.now() < m.t ? `<a href="${cal}" target="_blank" rel="noopener">+ Cal</a>` : "")
    + `</div>`;
}
$("#rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-i]"); if(!tr) return;
  selected = +tr.dataset.i;
  document.querySelectorAll("#rows tr").forEach(r => r.classList.toggle("sel", r === tr));
  status();
});

async function load(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    const j = await r.json();
    if(!j || !Array.isArray(j.matches) || j.matches.length < 10) throw 0;   // dati rotti: usa l’ultima copia buona
    try{ localStorage.setItem("purple-data", JSON.stringify(j)); }catch(e){}
    return j;
  }catch(e){
    try{ const c = JSON.parse(localStorage.getItem("purple-data") || "null"); if(c) return c; }catch(e){}
    return SNAPSHOT;
  }
}

const PX = {"A": "010101111101101", "B": "110101110101110", "C": "011100100100011", "D": "110101101101110", "E": "111100110100111", "F": "111100110100100", "G": "011100101101011", "H": "101101111101101", "I": "111010010010111", "J": "001001001101010", "K": "101101110101101", "L": "100100100100111", "M": "101111111101101", "N": "110101101101101", "O": "010101101101010", "P": "110101110100100", "Q": "010101101110011", "R": "110101110101101", "S": "011100010001110", "T": "111010010010010", "U": "101101101101111", "V": "101101101101010", "W": "101101111111101", "X": "101101010101101", "Y": "101101010010010", "Z": "111001010100111", "0": "111101101101111", "1": "010110010010111", "2": "110001010100111", "3": "110001010001110", "4": "101101111001001", "5": "111100110001110", "6": "011100111101111", "7": "111001010010010", "8": "111101111101111", "9": "111101111001110", " ": "000000000000000"};

function glyph(c,ch,x,y,col,s){
  const b = PX[ch] || PX[" "]; c.fillStyle = col;
  for(let i=0;i<15;i++) if(b[i]==="1") c.fillRect(x+(i%3)*s, y+Math.floor(i/3)*s, s, s);
}
const LIBERO = new Set([1,5,34]);   // Negro, Bellomo, Elezi
const KC_LIB = {O:"#1e0a3c",P:"#ffffff",L:"#ffffff",D:"#d6cbe9",W:"#6a2fb5"};
function kitCanvas(num, css){
  const lib = LIBERO.has(num), pal = lib ? KC_LIB : KC;
  const j = document.createElement("canvas"); j.width = 32; j.height = 30;
  j.style.width = (32*css)+"px"; j.style.height = (30*css)+"px";
  const c = j.getContext("2d");
  KIT.forEach((r,y) => { for(let x=0;x<r.length;x++){ const col = pal[r[x]]; if(col){ c.fillStyle = col; c.fillRect(x,y,1,1); } } });
  const t = String(num), w = t.length*6 + (t.length-1)*2; let x = Math.floor((32-w)/2);
  const fg = lib ? "#6a2fb5" : "#ffffff", sh = lib ? "#cbbbe6" : KC.D;
  for(const ch of t){ glyph(c,ch,x+1,12,sh,2); glyph(c,ch,x,11,fg,2); x += 8; }
  return j;
}
function nameCanvas(name, css){
  const up = name.toUpperCase(), nw = up.length*4-1;
  const n = document.createElement("canvas"); n.width = nw; n.height = 5;
  n.style.width = (nw*css)+"px"; n.style.height = (5*css)+"px";
  const nc = n.getContext("2d"); let nx = 0; for(const ch of up){ glyph(nc,ch,nx,0,"#2a0e55",1); nx += 4; }
  n.setAttribute("aria-hidden","true");
  return n;
}

/* ===== campo 6 vs 6 con shuffle ===== */
const Court = (() => {
  const box = document.getElementById("court"); if(!box) return null;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const els = new Map();
  ROSA.forEach(([name,num]) => {
    const p = document.createElement("div"); p.className = "pl";
    const h = document.createElement("div"); h.className = "hop";
    const j = kitCanvas(num, 1.25); j.setAttribute("role","img"); j.setAttribute("aria-label", `${name} ${num}`);
    const sd = document.createElement("i"); sd.className = "shadow";
    h.append(j, nameCanvas(name, 1)); p.append(h, sd); box.append(p); els.set(num, p);
  });
  const ball = document.createElement("div"); ball.className = "ball";
  const bi = document.createElement("img"); bi.alt = ""; const orb = document.querySelector(".head .orb"); if(orb) bi.src = orb.src;
  ball.append(bi); box.append(ball);

  let W = 0, CH = 0, BH = 0, layout = null;
  function size(){
    W = box.clientWidth; CH = Math.round(W * 0.6); BH = 68;
    box.style.height = (CH + BH) + "px";
    box.querySelector(".floor").style.height = CH + "px";
    box.querySelector(".bench").style.height = BH + "px";
  }
  // posizioni: squadra sinistra guarda a destra, squadra destra guarda a sinistra
  const X = {L:{front:.40, back:.185}, R:{front:.60, back:.815}}, Y = [.2,.5,.8];
  const slots = side => {
    const f = X[side].front, b = X[side].back, top = side==="L";
    // ordine: posizioni 1..6 (1 = battitore, dietro a destra)
    return top
      ? [[b,Y[2]],[f,Y[2]],[f,Y[1]],[f,Y[0]],[b,Y[0]],[b,Y[1]]]
      : [[b,Y[0]],[f,Y[0]],[f,Y[1]],[f,Y[2]],[b,Y[2]],[b,Y[1]]];
  };
  const shuffleArr = a => { for(let i=a.length-1;i>0;i--){ const k = Math.floor(Math.random()*(i+1)); [a[i],a[k]] = [a[k],a[i]]; } return a; };
  function deal(){
    // un libero per squadra (se ci sono), gli altri a caso
    const libs = shuffleArr(ROSA.map(r => r[1]).filter(n => LIBERO.has(n)));
    const rest = shuffleArr(ROSA.map(r => r[1]).filter(n => !LIBERO.has(n)));
    const teams = {L:[], R:[]}, bench = [];
    if(libs.length) teams.L.push(libs.shift());
    if(libs.length) teams.R.push(libs.shift());
    bench.push(...libs);
    for(const n of rest){
      const side = ["L","R"].find(sd => teams[sd].length < 6);
      side ? teams[side].push(n) : bench.push(n);
    }
    shuffleArr(bench);
    const pos = new Map();
    for(const sd of ["L","R"]){
      const s6 = slots(sd), list = teams[sd];
      const li = list.findIndex(n => LIBERO.has(n));
      const order = Array(6).fill(null);
      if(li >= 0){ const k = Math.random() < .5 ? 4 : 5; order[k] = list[li]; }   // libero in seconda linea, mai al servizio
      let q = list.filter((n,i) => i !== li);
      for(let k=0;k<6;k++) if(order[k] === null) order[k] = q.shift();
      order.forEach((n,k) => pos.set(n, {fx:s6[k][0], fy:s6[k][1], court:true}));
    }
    bench.forEach((n,i) => pos.set(n, {fx:(i+1)/(bench.length+1), fy:null, court:false}));
    const server = Math.random() < .5 ? "L" : "R";
    return {pos, server, serverNum: (() => { for(const [n,p] of pos) if(p.court && p.fx === X[server].back && p.fy === (server==="L"?Y[2]:Y[0])) return n; })()};
  }
  const px = p => {
    const pl = .06, pt = .09, pw = .88, ph = .82;
    if(!p.court) return [p.fx * W, CH + BH/2 + 7];
    return [(pl + pw*p.fx) * W, (pt + ph*p.fy) * CH];
  };
  function place(animate){
    els.forEach((el, n) => {
      const [x,y] = px(layout.pos.get(n));
      el.style.left = x + "px"; el.style.top = y + "px";
    });
    const sp = layout.pos.get(layout.serverNum);
    if(sp){ const [x,y] = px(sp); const dx = layout.server === "L" ? -22 : 22; ball.style.left = (x+dx) + "px"; ball.style.top = (y-14) + "px"; }
  }
  function hop(){
    if(reduce) return;
    let i = 0;
    els.forEach(el => {
      const d = (i++) * 30;
      el.style.transitionDelay = d + "ms";
      el.firstChild.animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(-16px) scale(1.12)"},{transform:"translateY(0) scale(1)"}],
        {duration:750, delay:d, easing:"cubic-bezier(.3,.6,.4,1)"});
    });
    ball.animate([{transform:"rotate(0) scale(1)"},{transform:"rotate(360deg) scale(1.4)"},{transform:"rotate(720deg) scale(1)"}],{duration:900,easing:"ease-out"});
  }
  function shuffle(){ layout = deal(); hop(); place(true); }
  function init(){
    size(); layout = deal();
    // ingresso: tutti partono dalla rete
    els.forEach(el => { el.style.transition = "none"; el.style.left = (W/2)+"px"; el.style.top = (CH/2)+"px"; });
    ball.style.transition = "none"; ball.style.left = (W/2)+"px"; ball.style.top = (CH/2)+"px";
    box.offsetHeight;
    els.forEach(el => el.style.transition = ""); ball.style.transition = "";
    requestAnimationFrame(() => { hop(); place(true); });
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); els.forEach(el => el.style.transitionDelay = "0ms"); place(false); }, 120); });
  document.getElementById("shuffle").addEventListener("click", shuffle);
  init();
  return {shuffle};
})();

function show(j){
  try{ use(j); render(); }
  catch(e){ console.error(e); if(j !== SNAPSHOT){ use(SNAPSHOT); render(); } }
}
show(SNAPSHOT);
load().then(show);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") load().then(show); });
</script>
</body>
