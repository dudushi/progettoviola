<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purple contro i rivali</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --text:#333333; --muted:#888888; --line:#dddddd;
  --purple:#6a2fb5; --purple-dark:#4a1c86; --purple-soft:#f3ecfc;
  --glow:#fff38a; --win:#2f9e1f; --loss:#cc1f1f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Trebuchet MS","Lucida Grande","Lucida Sans Unicode",Verdana,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px}

h1{font-family:Lobster,"Brush Script MT",Georgia,cursive;font-weight:400;font-size:58px;line-height:1;margin:0;
  color:var(--purple);text-align:center;
  text-shadow:0 1px 0 #fff,0 2px 0 #d9c6f3,0 4px 6px rgba(74,28,134,.25)}
.tag{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 22px;font-style:italic;font-family:Georgia,serif}

/* glossy select, 2010 */
.pick{position:relative;border:1px solid #b9a6d6;border-radius:8px;
  background:linear-gradient(#ffffff 0%,#f4eefc 50%,#e7dcf7 51%,#f1eafb 100%);
  box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.12)}
.pick label{position:absolute;left:14px;top:7px;font-size:11px;color:var(--purple);font-weight:bold}
.pick select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:transparent;
  font:bold 19px "Trebuchet MS","Lucida Grande",Verdana,sans-serif;color:var(--purple-dark);
  padding:24px 44px 9px 14px;cursor:pointer}
.pick::after{content:"";position:absolute;right:16px;top:50%;margin-top:-3px;border:7px solid transparent;border-top-color:var(--purple);pointer-events:none}
.pick select:focus-visible{outline:3px solid var(--glow);border-radius:8px}

/* the gap badge */
.gap{margin:22px 0 8px;text-align:center}
.badge{position:relative;display:inline-block;min-width:150px;padding:14px 26px 12px;border-radius:14px;color:#fff;overflow:hidden;
  font:bold 46px/1 "Trebuchet MS",Verdana,sans-serif;text-shadow:0 -1px 0 rgba(0,0,0,.35);
  border:1px solid rgba(0,0,0,.25);box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.badge::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.12))}
.badge small{display:block;font-size:13px;font-weight:bold;margin-top:4px;opacity:.95}
.badge.up{background:linear-gradient(#5fd14a,#2f9e1f)}
.badge.down{background:linear-gradient(#ff5c5c,#c41515)}
.badge.even{background:linear-gradient(#b48ae6,#6a2fb5)}
.say{margin:12px 0 0;font-size:16px;text-align:center}
.say b{color:var(--purple)}

/* table */
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:22px;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid #eeeeee}
tr:last-child td{border-bottom:0}
thead th{background:linear-gradient(#fafafa,#ececec);font-size:13px;color:#555;border-bottom:1px solid var(--line)}
thead th.us{color:var(--purple)}
td.k{text-align:left;color:#555;font-size:14px;padding-left:12px}
td.v{font-weight:bold;font-size:16px}
td.lit{background:var(--glow);box-shadow:inset 0 0 0 1px #f0d000,0 0 10px #ffe94d;position:relative}
td.d{font-weight:bold;font-size:14px;width:56px}
td.d.pos{color:var(--win)} td.d.neg{color:var(--loss)} td.d.zero{color:#aaa}
tbody tr:nth-child(even) td:not(.lit){background:#fbf9fe}

/* head to head */
.h2h{margin-top:22px;border:1px dashed #c9b6e6;border-radius:8px;background:var(--purple-soft);padding:12px 14px}
.h2h h2{font-family:Lobster,Georgia,cursive;font-weight:400;color:var(--purple);font-size:24px;margin:0 0 6px}
.h2h ul{list-style:none;margin:0;padding:0}
.h2h li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #e3d7f4}
.h2h li:first-child{border-top:0}
.res{font-weight:bold}
.res.w{color:var(--win)} .res.l{color:var(--loss)} .res.n{color:var(--muted);font-weight:normal}
.foot{text-align:center;color:#aaa;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Purple</h1>
  <p class="tag">Quanto ci separa dai rivali</p>

  <div class="pick">
    <label for="rival">Rivale</label>
    <select id="rival"></select>
  </div>

  <div class="gap" aria-live="polite">
    <div class="badge" id="badge"></div>
    <p class="say" id="say"></p>
  </div>

  <table>
    <thead><tr><th></th><th class="us">Purple</th><th>Diff.</th><th id="rName">Rivale</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="h2h">
    <h2>Scontri diretti</h2>
    <ul id="h2h"></ul>
  </div>

  <p class="foot" id="foot"></p>
</div>
<script>
const RIVALS = ["Kolbe", "Icaro M1"];
const TEAM = /purple/i;
const SNAPSHOT = {"updated":"2026-11-08T14:00+01:00","matches":[{"g":1,"n":611105,"t":"2026-11-02T21:00:00+01:00","a":"PGS Pianezza","b":"Polisport Nuncas","venue":"Pal. Papa Giovanni XXIII","city":"Pianezza","q":"Pal. Papa Giovanni XXIII - Via A. Manzoni 7, Pianezza","score":[3,0],"sets":[[25,20],[25,17],[25,19]]},{"g":1,"n":611102,"t":"2026-11-03T21:00:00+01:00","a":"ASD Ecosportorino Dark","b":"Camaleonte Brandizzo","venue":"Pal. Cecchi","city":"Torino","q":"Pal. Cecchi - Via A. Cecchi, 14, Torino","note":"Ammessi solo tesserati","score":[3,2],"sets":[[25,10],[24,26],[25,23],[25,18],[15,12]]},{"g":1,"n":611103,"t":"2026-11-05T20:45:00+01:00","a":"Ecosport Purple","b":"Kolbe","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino","score":[2,3],"sets":[[25,22],[17,25],[16,25],[25,22],[14,16]]},{"g":10,"n":611149,"t":"2026-11-05T21:15:00+01:00","a":"Caselette Volley","b":"Icaro M1","venue":"Istituto Comprensivo","city":"Caselette","q":"Istituto Comprensivo - Strada Contessa, 90 - Caselette","score":[0,3],"sets":[[19,25],[19,25],[19,25]]},{"g":1,"n":611101,"t":"2026-11-05T21:30:00+01:00","a":"Maschile B Linnaeus","b":"Kubo Volley","venue":"Pal.Comunale","city":"Borgone di Susa","q":"Pal.Comunale - Via Bobba Guido, 41 - Borgone di Susa","score":[3,0],"sets":[[25,16],[25,18],[25,21]]},{"g":2,"n":611109,"t":"2026-11-11T21:15:00+01:00","a":"Camaleonte Brandizzo","b":"Ecosport Purple","venue":"Via Nicolao Cena,2","city":"Brandizzo","q":"via Nicolao Cena,2 Brandizzo"},{"g":3,"n":611112,"t":"2026-11-19T20:45:00+01:00","a":"Ecosport Purple","b":"Maschile B Linnaeus","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":13,"n":611165,"t":"2026-11-26T20:45:00+01:00","a":"Ecosport Purple","b":"ASD Ecosportorino Dark","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":5,"n":611121,"t":"2026-12-03T20:45:00+01:00","a":"Ecosport Purple","b":"Kubo Volley","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":6,"n":611130,"t":"2026-12-10T20:45:00+01:00","a":"Ecosport Purple","b":"Icaro M1","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":7,"n":611132,"t":"2026-12-14T21:00:00+01:00","a":"PGS Pianezza","b":"Ecosport Purple","venue":"Pal. Papa Giovanni XXIII","city":"Pianezza","q":"Pal. Papa Giovanni XXIII - Via A. Manzoni 7, Pianezza"},{"g":8,"n":611139,"t":"2027-01-14T20:45:00+01:00","a":"Ecosport Purple","b":"Polisport Nuncas","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":9,"n":611143,"t":"2027-01-21T21:15:00+01:00","a":"Caselette Volley","b":"Ecosport Purple","venue":"Istituto Comprensivo","city":"Caselette","q":"Istituto Comprensivo - Strada Contessa, 90 - Caselette"},{"g":10,"n":611148,"t":"2027-01-24T18:00:00+01:00","a":"Kolbe","b":"Ecosport Purple","venue":"Pal. Aprica","city":"Torino","q":"Pal. Aprica Via Bard, 39 Torino"},{"g":11,"n":611154,"t":"2027-02-04T20:45:00+01:00","a":"Ecosport Purple","b":"Camaleonte Brandizzo","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":12,"n":611157,"t":"2027-02-18T21:30:00+01:00","a":"Maschile B Linnaeus","b":"Ecosport Purple","venue":"Pal.Comunale","city":"Borgone di Susa","q":"Pal.Comunale - Via Bobba Guido, 41 - Borgone di Susa"},{"g":4,"n":611120,"t":"2027-02-24T21:00:00+01:00","a":"ASD Ecosportorino Dark","b":"Ecosport Purple","venue":"Pal. Cecchi","city":"Torino","q":"Pal. Cecchi - Via A. Cecchi, 14, Torino","note":"Ammessi solo tesserati"},{"g":14,"n":611166,"t":"2027-03-03T21:00:00+01:00","a":"Kubo Volley","b":"Ecosport Purple","venue":"Palestra Palazzeschi","city":"Torino","q":"Palestra Palazzeschi - Scuola Media Statale Aldo Palazzeschi, Torino"},{"g":15,"n":611175,"t":"2027-03-12T20:30:00+01:00","a":"Icaro M1","b":"Ecosport Purple","venue":"Impianto Sportivo Luini","city":"Torino","q":"Impianto Sportivo Luini , Via luini 170, Torino"},{"g":16,"n":611177,"t":"2027-03-18T20:45:00+01:00","a":"Ecosport Purple","b":"PGS Pianezza","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"},{"g":17,"n":611184,"t":"2027-04-01T21:00:00+02:00","a":"Polisport Nuncas","b":"Ecosport Purple","venue":"Cecchi","city":"Torino","q":"Cecchi Via Cecchi 16, Torino","note":"Ammessi solo tesserati"},{"g":18,"n":611188,"t":"2027-04-08T20:45:00+02:00","a":"Ecosport Purple","b":"Caselette Volley","venue":"Scuola Vivaldi","city":"Torino","q":"Scuola Vivaldi - Via Casteldelfino, 24, Torino"}]};
const $ = s => document.querySelector(s);
const fmt = (t,o) => new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",...o}).format(t);
let LEAGUE = [], UPDATED = "";

function scoreOf(x){
  if(x.score && (x.score[0] || x.score[1])) return x.score;
  if(x.sets && x.sets.length){ const w = x.sets.filter(s => s[0]>s[1]).length; return [w, x.sets.length-w]; }
  return null;
}
function standings(){
  const T = {}, add = n => T[n] || (T[n] = {n, pt:0, g:0, v:0, sv:0, sp:0, pf:0, ps:0});
  LEAGUE.forEach(x => {
    add(x.a); add(x.b);
    const sc = scoreOf(x); if(!sc) return;
    const A = T[x.a], B = T[x.b];
    A.g++; B.g++; A.sv += sc[0]; A.sp += sc[1]; B.sv += sc[1]; B.sp += sc[0];
    (x.sets || []).forEach(s => { A.pf += s[0]; A.ps += s[1]; B.pf += s[1]; B.ps += s[0]; });
    const W = sc[0] > sc[1] ? A : B, L = W === A ? B : A;
    W.v++;
    if(Math.min(sc[0], sc[1]) === 2){ W.pt += 2; L.pt += 1; } else W.pt += 3;
  });
  const q = (a,b) => b ? a/b : (a ? 1e9 : 0);
  const list = Object.values(T).sort((a,b) => b.pt-a.pt || b.v-a.v || q(b.sv,b.sp)-q(a.sv,a.sp) || q(b.pf,b.ps)-q(a.pf,a.ps) || a.n.localeCompare(b.n));
  list.forEach((r,i) => r.pos = i+1);
  return list;
}
const plural = (n, one, many) => n === 1 ? one : many;

function show(){
  const rival = $("#rival").value;
  const table = standings();
  const us = table.find(r => TEAM.test(r.n)), them = table.find(r => r.n === rival);
  if(!us || !them) return;
  const gap = us.pt - them.pt;

  const badge = $("#badge");
  badge.className = "badge " + (gap > 0 ? "up" : gap < 0 ? "down" : "even");
  badge.innerHTML = (gap > 0 ? "+" : gap < 0 ? "−" : "") + Math.abs(gap) + `<small>${plural(Math.abs(gap),"punto","punti")}</small>`;
  $("#say").innerHTML = gap > 0 ? `Siamo avanti a <b>${rival}</b> di ${gap} ${plural(gap,"punto","punti")}`
    : gap < 0 ? `<b>${rival}</b> è avanti di ${-gap} ${plural(-gap,"punto","punti")}`
    : `Pari punti con <b>${rival}</b>`;
  $("#rName").textContent = rival;

  // rows: [label, ours, theirs, shown ours, shown theirs, higher is better?]
  const rows = [
    ["Posizione", us.pos, them.pos, us.pos+"°", them.pos+"°", false],
    ["Punti", us.pt, them.pt, us.pt, them.pt, true],
    ["Vinte", us.v, them.v, `${us.v} su ${us.g}`, `${them.v} su ${them.g}`, true],
    ["Set", us.sv-us.sp, them.sv-them.sp, `${us.sv}–${us.sp}`, `${them.sv}–${them.sp}`, true],
    ["Punti nei set", us.pf-us.ps, them.pf-them.ps, `${us.pf}–${us.ps}`, `${them.pf}–${them.ps}`, true]
  ];
  $("#rows").innerHTML = rows.map(([k,a,b,sa,sb,hi]) => {
    const d = hi ? a-b : b-a;
    const cls = d > 0 ? "pos" : d < 0 ? "neg" : "zero";
    return `<tr><td class="k">${k}</td>
      <td class="v${d>0?" lit":""}">${sa}</td>
      <td class="d ${cls}">${d>0?"+":d<0?"−":""}${d===0?"=":Math.abs(d)}</td>
      <td class="v${d<0?" lit":""}">${sb}</td></tr>`;
  }).join("");

  const games = LEAGUE.filter(x => (TEAM.test(x.a) && x.b === rival) || (TEAM.test(x.b) && x.a === rival)).sort((p,q) => p.t-q.t);
  $("#h2h").innerHTML = games.map(x => {
    const home = TEAM.test(x.a), sc = scoreOf(x);
    const mine = sc ? (home ? sc : [sc[1], sc[0]]) : null;
    const when = `${fmt(x.t,{day:"numeric",month:"short"}).replace(".","")}, ${home ? "in casa" : "fuori"}`;
    const r = mine ? `<span class="res ${mine[0]>mine[1]?"w":"l"}">${mine[0]>mine[1]?"Vinta":"Persa"} ${mine[0]}–${mine[1]}</span>`
                   : `<span class="res n">da giocare, ore ${fmt(x.t,{hour:"2-digit",minute:"2-digit"})}</span>`;
    return `<li><span>${when}</span>${r}</li>`;
  }).join("");

  $("#foot").textContent = UPDATED ? "Classifica aggiornata al " + fmt(Date.parse(UPDATED),{day:"numeric",month:"long"}) : "";
}

function use(json){
  UPDATED = json.updated || "";
  LEAGUE = (json.matches || []).map(x => ({...x, t: Date.parse(x.t)}));
}
$("#rival").innerHTML = RIVALS.map(r => `<option>${r}</option>`).join("");
$("#rival").addEventListener("change", show);
use(SNAPSHOT); show();
fetch("data.json?t="+Date.now(), {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(j => { if(j){ use(j); show(); } }).catch(() => {});
</script>
</body>
</html>
