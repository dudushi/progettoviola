name: Aggiorna calendario
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: python scripts/update.py
      - run: |
          git config user.name "purple-bot"
          git config user.email "purple-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Aggiorna calendario e risultati" && git push)
